name = "apex-professores"
type = "javascript"
main = "index.js"
compatibility_date = "2024-01-01"

[build]
command = "cd projeto-questoes-jsx && npm install && npm run build"
cwd = "."
watch_paths = ["projeto-questoes-jsx/**/*.jsx", "projeto-questoes-jsx/**/*.js", "projeto-questoes-jsx/package.json"]

[env.production]
name = "apex-professores-prod"

[build.upload]
format = "modules"
